[pytest]
# Current default suite. Historical tests stay on disk as diagnostic material.
# Reasons and the exact list are in 수정내역_테스트정리.md.
testpaths = tests Part3/tests
addopts =
    --ignore=tests/live_parity
    --ignore=tests/sparse_events
    --ignore=tests/special2_7
    --deselect=tests/test_event_e1.py::test_bar_close_fact_ignores_forming_updates_until_new_bar
    --deselect=tests/test_event_e2_domains.py::test_sweep_canonical_transitions_and_resume
    --deselect=tests/test_event_e2_oz_pilot.py::test_first_oz_state_matches_entire_frozen_module_and_midnight_checkpoint
    --deselect=tests/test_event_perf1.py::test_bundle_cache_copies_features_attrs_and_invalidates
    --deselect=tests/test_part2_dashboard_ui31.py::Part2DashboardTest::test_dashboard_and_controls
    --deselect=tests/test_ui_slots.py::test_gui_modes_dates_and_disabled_watch_time
